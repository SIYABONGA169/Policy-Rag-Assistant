<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Policy Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #343541;
            color: #ececf1;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #202123;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #4d4d4f;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .clear-button {
            background: #565869;
            color: #ececf1;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .clear-button:hover {
            background: #6b6d7e;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 16px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: #5436da;
            color: white;
        }

        .message.assistant .avatar {
            background: #10a37f;
            color: white;
        }

        .message-content {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
            text-align: left;
        }

        .message.user .message-content {
            background: #5436da;
            color: white;
        }

        .message.assistant .message-content {
            background: #444654;
            color: #ececf1;
        }

        .citations {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
        }

        .citations h4 {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #9ca3af;
            text-transform: uppercase;
        }

        .citation-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .citation-item strong {
            color: #10a37f;
        }

        .input-container {
            background: #40414f;
            padding: 20px;
            border-top: 1px solid #4d4d4f;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        #questionInput {
            flex: 1;
            background: #343541;
            border: 1px solid #565869;
            border-radius: 8px;
            padding: 12px 16px;
            color: #ececf1;
            font-size: 15px;
            resize: none;
            font-family: inherit;
            max-height: 200px;
        }

        #questionInput:focus {
            outline: none;
            border-color: #10a37f;
        }

        #questionInput::placeholder {
            color: #8e8ea0;
        }

        #sendButton {
            background: #10a37f;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        #sendButton:hover:not(:disabled) {
            background: #1a7f64;
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-8px);
            }
        }

        .error-message {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            color: #fca5a5;
            font-size: 14px;
            max-width: 800px;
            margin: 0 auto;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 600px) {
            .message {
                gap: 8px;
            }

            .avatar {
                width: 28px;
                height: 28px;
                font-size: 12px;
            }

            .message-content {
                font-size: 14px;
                padding: 10px 12px;
            }

            .input-wrapper {
                flex-direction: column;
            }

            #sendButton {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Company Policy Assistant</h1>
        <button class="clear-button" onclick="clearChat()">Clear Chat</button>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message assistant">
            <div class="avatar">AI</div>
            <div class="message-content">
                Hello! I'm your Company Policy Assistant. Ask me any questions about company policies and procedures, and I'll provide answers with citations from our policy documents.
            </div>
        </div>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <div class="input-container">
        <div class="input-wrapper">
            <textarea 
                id="questionInput" 
                placeholder="Ask a question about company policies..."
                rows="1"
            ></textarea>
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const questionInput = document.getElementById('questionInput');
        const sendButton = document.getElementById('sendButton');
        const errorMessage = document.getElementById('errorMessage');
        
        // Store chat history for follow-up questions
        let chatHistory = [];

        // Auto-resize textarea
        questionInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        // Allow Enter to send (Shift+Enter for new line)
        questionInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function clearChat() {
            chatContainer.innerHTML = `<div class="message assistant"><div class="avatar">AI</div><div class="message-content">Hello! I'm your Company Policy Assistant. Feel free to ask me any questions about company policies and procedures, and I'll be happy to assist you.</div></div>`;
            chatHistory = [];
            hideError();
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        function addMessage(content, isUser, citations) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = isUser ? 'U' : 'AI';

            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.innerHTML = content;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(messageContent);

            // Add citations section for assistant messages
            if (!isUser && citations && citations.length > 0) {
                const citationsDiv = document.createElement('div');
                citationsDiv.className = 'citations';
                citationsDiv.style.marginTop = '12px';
                citationsDiv.style.padding = '10px 16px';
                citationsDiv.style.background = '#2d2d3a';
                citationsDiv.style.borderRadius = '8px';
                citationsDiv.style.fontSize = '13px';
                citationsDiv.style.color = '#9ca3af';
                
                const citationsTitle = document.createElement('div');
                citationsTitle.style.fontWeight = '600';
                citationsTitle.style.marginBottom = '8px';
                citationsTitle.style.color = '#d1d5db';
                citationsTitle.textContent = 'Sources & Citations:';
                citationsDiv.appendChild(citationsTitle);
                
                citations.forEach(citation => {
                    const citationItem = document.createElement('div');
                    citationItem.style.marginBottom = '6px';
                    citationItem.style.paddingLeft = '12px';
                    citationItem.style.borderLeft = '2px solid #10a37f';
                    citationItem.innerHTML = `<strong>${citation.filename}</strong> - ${citation.section}`;
                    citationsDiv.appendChild(citationItem);
                });

                messageDiv.appendChild(citationsDiv);
            }

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addTypingIndicator() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'typingIndicator';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = 'AI';

            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(messageContent);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        async function sendMessage() {
            const question = questionInput.value.trim();

            if (!question) {
                return;
            }

            hideError();
            questionInput.value = '';
            questionInput.style.height = 'auto';
            sendButton.disabled = true;

            // Add user message
            addMessage(question, true);

            // Add typing indicator
            addTypingIndicator();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question: question, chat_history: chatHistory })
                });

                const data = await response.json();

                removeTypingIndicator();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to get response');
                }

                // Add assistant response
                addMessage(data.answer, false, data.citations);
                
                // Update chat history
                chatHistory.push({ role: 'user', content: question });
                chatHistory.push({ role: 'assistant', content: data.answer });

            } catch (error) {
                removeTypingIndicator();
                showError(error.message);
            } finally {
                sendButton.disabled = false;
                questionInput.focus();
            }
        }
    </script>
</body>
</html>
